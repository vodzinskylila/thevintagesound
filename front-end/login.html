<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | The Vintage Sound</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                primary: '#bd0f2c',
                'bg-light': '#f8f6f6',
                'bg-dark': '#121011',
                'surface': '#1c1819',
                'border': '#39282b',
            },
        },
    },
}
</script>
<style>body { font-family: 'Plus Jakarta Sans', sans-serif; }
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  font-family: 'Material Symbols Outlined';
}
</style>
</head>
<body class="bg-bg-light dark:bg-bg-dark text-gray-900 dark:text-white min-h-screen flex flex-col">

<!-- HEADER -->
<header class="w-full border-b border-border/50 px-6 py-4 flex items-center justify-between bg-bg-dark/80 backdrop-blur-md sticky top-0 z-50">
    <a href="index.html" class="flex items-center gap-3">
        <div class="bg-primary p-1.5 rounded-lg">
            <span class="material-symbols-outlined text-white text-2xl">album</span>
        </div>
        <span class="text-xl font-bold tracking-tight uppercase">The Vintage Sound</span>
    </a>
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-400">
        <a href="loja.html" class="hover:text-primary transition-colors">Loja</a>
        <a href="assinaturas.html" class="hover:text-primary transition-colors">Assinaturas</a>
    </nav>
</header>

<!-- MAIN -->
<main class="flex-grow flex items-center justify-center p-6">
    <div class="max-w-5xl w-full grid md:grid-cols-2 gap-8">

        <!-- LOGIN -->
        <div class="bg-surface/40 backdrop-blur-sm border border-border/30 rounded-xl p-8">
            <div class="mb-8">
                <div class="flex items-center gap-2 text-primary text-xs font-bold uppercase tracking-widest mb-2">
                    <span class="w-8 h-px bg-primary"></span> Bem-vindo
                </div>
                <h1 class="text-2xl font-bold text-white">Entrar</h1>
                <p class="text-gray-400 text-sm mt-1">Acesse sua conta de colecionador.</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">E-mail</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">alternate_email</span>
                        <input id="login-email" type="email" placeholder="seu@email.com" required
                            class="w-full bg-bg-dark/50 border border-border rounded-lg py-3 pl-12 pr-4 text-white focus:border-primary focus:outline-none transition-all"/>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Senha</label>
                        <a href="#" class="text-xs text-primary/80 hover:text-primary">Esqueceu?</a>
                    </div>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">lock</span>
                        <input id="login-password" type="password" placeholder="••••••••" required
                            class="w-full bg-bg-dark/50 border border-border rounded-lg py-3 pl-12 pr-12 text-white focus:border-primary focus:outline-none transition-all"/>
                        <button type="button" id="toggle-login-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <div id="login-error" class="hidden text-red-500 text-sm bg-red-500/10 border border-red-500/30 rounded-lg px-4 py-3"></div>
                <button id="login-btn" type="submit" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 rounded-lg transition-all flex items-center justify-center gap-2">
                    <span>Entrar</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>
        </div>

        <!-- REGISTER -->
        <div class="bg-primary/5 border border-primary/20 rounded-xl p-8 relative">
            <div class="absolute top-0 right-0 p-6 text-primary/10">
                <span class="material-symbols-outlined text-[100px]">add_circle</span>
            </div>
            <div class="relative mb-8">
                <div class="flex items-center gap-2 text-primary text-xs font-bold uppercase tracking-widest mb-2">
                    <span class="w-8 h-px bg-primary"></span> Junte-se
                </div>
                <h2 class="text-2xl font-bold text-white">Criar Conta</h2>
                <p class="text-gray-400 text-sm mt-1">Faça parte do clube de colecionadores.</p>
            </div>

            <form id="register-form" class="space-y-4 relative">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Nome</label>
                        <input id="reg-firstname" type="text" placeholder="Nome" required
                            class="w-full bg-bg-dark/50 border border-border rounded-lg py-3 px-4 text-white focus:border-primary focus:outline-none transition-all"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Sobrenome</label>
                        <input id="reg-lastname" type="text" placeholder="Sobrenome" required
                            class="w-full bg-bg-dark/50 border border-border rounded-lg py-3 px-4 text-white focus:border-primary focus:outline-none transition-all"/>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">E-mail</label>
                    <input id="reg-email" type="email" placeholder="seu@email.com" required
                        class="w-full bg-bg-dark/50 border border-border rounded-lg py-3 px-4 text-white focus:border-primary focus:outline-none transition-all"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Senha</label>
                    <div class="relative">
                        <input id="reg-password" type="password" placeholder="Mínimo 8 caracteres" required minlength="8"
                            class="w-full bg-bg-dark/50 border border-border rounded-lg py-3 px-4 text-white focus:border-primary focus:outline-none transition-all"/>
                        <button type="button" id="toggle-reg-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-start gap-3">
                    <input id="reg-newsletter" type="checkbox" class="mt-1 w-4 h-4 rounded border-border bg-bg-dark/50 text-primary focus:ring-primary"/>
                    <label for="reg-newsletter" class="text-xs text-gray-400">Receber newsletter com novidades e lançamentos.</label>
                </div>
                <div id="register-error" class="hidden text-red-500 text-sm bg-red-500/10 border border-red-500/30 rounded-lg px-4 py-3"></div>
                <button id="register-btn" type="submit" class="w-full border-2 border-primary text-primary hover:bg-primary hover:text-white font-bold py-3 rounded-lg transition-all flex items-center justify-center gap-2">
                    <span>Criar Conta</span>
                    <span class="material-symbols-outlined">person_add</span>
                </button>
            </form>
            <p class="text-[10px] text-gray-600 uppercase tracking-widest text-center mt-4">Ao criar conta, você aceita os <a href="sobre.html" class="text-gray-400 hover:text-primary underline">Termos</a>.</p>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="w-full border-t border-border/50 py-6 px-6 bg-bg-dark">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-gray-500 uppercase tracking-widest">
        <span>© 2024 The Vintage Sound</span>
        <div class="flex gap-6">
            <a href="sobre.html" class="hover:text-white transition-colors">Ajuda</a>
            <a href="sobre.html" class="hover:text-white transition-colors">Privacidade</a>
        </div>
    </div>
</footer>

<script src="api.js"></script>
<script>
document.getElementById('toggle-login-password').addEventListener('click', function() {
    const input = document.getElementById('login-password');
    const icon = this.querySelector('span');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.textContent = input.type === 'password' ? 'visibility' : 'visibility_off';
});

document.getElementById('toggle-reg-password').addEventListener('click', function() {
    const input = document.getElementById('reg-password');
    const icon = this.querySelector('span');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.textContent = input.type === 'password' ? 'visibility' : 'visibility_off';
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');
    btn.disabled = true;
    btn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin mx-auto"></div>';

    const { ok, data } = await Auth.login(
        document.getElementById('login-email').value.trim(),
        document.getElementById('login-password').value
    );

    if (ok) {
        toast('Login realizado!', 'success');
        setTimeout(() => window.location.href = 'index.html', 500);
    } else {
        errorEl.textContent = data.message || 'Erro ao fazer login.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Entrar</span><span class="material-symbols-outlined">arrow_forward</span>';
    }
});

document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    const errorEl = document.getElementById('register-error');
    btn.disabled = true;
    btn.innerHTML = '<div class="w-5 h-5 border-2 border-primary/30 border-t-primary rounded-full animate-spin mx-auto"></div>';

    const { ok, data } = await Auth.register(
        document.getElementById('reg-firstname').value.trim(),
        document.getElementById('reg-lastname').value.trim(),
        document.getElementById('reg-email').value.trim(),
        document.getElementById('reg-password').value,
        document.getElementById('reg-newsletter').checked
    );

    if (ok) {
        toast('Conta criada com sucesso!', 'success');
        setTimeout(() => window.location.href = 'index.html', 500);
    } else {
        errorEl.textContent = data.message || 'Erro ao criar conta.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Criar Conta</span><span class="material-symbols-outlined">person_add</span>';
    }
});
</script>
</body>
</html>
